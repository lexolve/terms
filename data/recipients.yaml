# Mottakere av personopplysninger i Låvlis tjenester.
# Eneste kilde for mottakertabellene i personverndokumentene og for den offentlige listen over underleverandører.
#
# Nøkler: name, task, role, part, personal_data, location, transfer_basis, services.
# role: processor, independent_controller eller unresolved.
# part: business (behandling for virksomheten), lavli (Låvlis egen behandling) eller both.
#
# services: Låvli Privat, Bedrift og Plattform kjører på samme plattform.
# Lexolve OS har egne leverandører, med unntak av Google Cloud og Customer.io.

