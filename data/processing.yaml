    bedrift: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å forbedre tjenesten)
    lexolve-os: GDPR art. 6 nr. 1 bokstav a (samtykke), jf. ekomloven
    plattform: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å forbedre tjenesten)
  retention:
