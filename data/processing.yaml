# Behandlinger av personopplysninger i Låvlis tjenester.
# Eneste kilde for tabellene om behandling i personverndokumentene og i databehandleravtalen.
# Verdier merket TODO venter på avklaringer.
#
# Nøkler: id, personal_data, data_subjects, purpose, services, controller, legal_basis, retention, deletion.
# controller: lavli eller business. legal_basis fylles bare ut når controller er lavli.
# Felt som er ulike mellom tjenestene, har én verdi per tjeneste.

- id: innhold
  personal_data:
    privat: Spørsmål, KI-svar, opplastede dokumenter og tidsstempel, som kan omfatte særlige kategorier av personopplysninger
    bedrift: Spørsmål, KI-svar, opplastede dokumenter og tidsstempel, som kan omfatte særlige kategorier av personopplysninger
    lexolve-os: Saksinnhold, spørsmål, KI-svar, opplastede dokumenter og dokumenter som lages med maler, og tidsstempel, som kan omfatte særlige kategorier av personopplysninger
    plattform: Spørsmål, KI-svar, opplastede dokumenter og tidsstempel, som kan omfatte særlige kategorier av personopplysninger
  data_subjects:
    privat: Brukere og personer som omtales i samtaler og dokumenter
    bedrift: Brukere og personer som omtales i samtaler og dokumenter
    lexolve-os: Brukere og personer som omtales i saker og dokumenter
    plattform: Brukere og personer som omtales i samtaler og dokumenter
  purpose: Levere tjenesten
  services: [privat, bedrift, lexolve-os, plattform]
  controller:
    privat: lavli
    bedrift: business
    lexolve-os: business
    plattform: business
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav b (avtale med deg). For personer som omtales, art. 6 nr. 1 bokstav f (berettiget interesse i at brukeren får juridisk informasjon om sin sak). Særlige kategorier etter art. 9 nr. 2 bokstav f (rettskrav)
  retention:
    privat: 270 dager
    bedrift: 270 dager
    lexolve-os: Så lenge kontoen består
    plattform: Stilles inn av virksomheten
  deletion:
    privat: Automatisk i trinn, med arkivering, gjenopprettingsperiode og permanent sletting. Ved opphør innen 30 dager, og i sikkerhetskopier innen ytterligere 30 dager
    bedrift: Automatisk i trinn, med arkivering, gjenopprettingsperiode og permanent sletting. Ved opphør etter 30 dager, når fristen for å kreve eksport er ute, og i sikkerhetskopier innen ytterligere 30 dager
    lexolve-os: Automatisk i trinn, med arkivering, gjenopprettingsperiode og permanent sletting. Ved opphør etter 30 dager, når fristen for å kreve eksport er ute, og i sikkerhetskopier innen ytterligere 30 dager
    plattform: Automatisk i trinn, med arkivering, gjenopprettingsperiode og permanent sletting. Ved opphør etter 30 dager, når fristen for å kreve eksport er ute, og i sikkerhetskopier innen ytterligere 30 dager

- id: statistikk
  personal_data: Spørsmål, KI-svar og opplastede dokumenter
  data_subjects: Brukere og personer som omtales i samtaler og dokumenter
  purpose: Anonymisering for å lage aggregert statistikk
  services: [privat, bedrift, lexolve-os, plattform]
  controller:
    privat: lavli
    bedrift: business
    lexolve-os: business
    plattform: business
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å forstå hvordan tjenesten brukes). Anonymiseringen er forenlig viderebehandling, jf. art. 5 nr. 1 bokstav b, art. 6 nr. 4 og art. 89 nr. 1
  retention: Ikke lenger enn innholdet. Statistikken inneholder ikke personopplysninger

- id: innlogging
  personal_data:
    privat: Navn, e-postadresse, rolle, innloggingsmetode, sesjonstokener og IP-adresse
    bedrift: Navn, e-postadresse, rolle, innloggingsmetode, sesjonstokener og IP-adresse
    lexolve-os: Navn, e-postadresse, telefonnummer, rolle og innloggingstokener
    plattform: Navn, e-postadresse, rolle, innloggingsmetode, sesjonstokener og IP-adresse
  data_subjects: Brukere
  purpose: Innlogging, brukerkonto og tilgangskontroll
  services: [privat, bedrift, lexolve-os, plattform]
  controller: lavli
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav b (avtale med deg)
    bedrift: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å gi virksomhetens brukere sikker tilgang)
    lexolve-os: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å gi virksomhetens brukere sikker tilgang)
    plattform: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å gi virksomhetens brukere sikker tilgang)
  retention: Så lenge kontoen eller avtalen består. Sesjoner så lenge sesjonen varer

- id: driftslogger
  personal_data: Trafikkdata, nettlesertype og operasjonelle logger, uten meldingsinnhold
  data_subjects: Brukere
  purpose: Drift, feilretting og sikkerhet
  services: [privat, bedrift, lexolve-os, plattform]
  controller: lavli
  legal_basis: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i sikker og stabil drift)
  retention: 30 dager

- id: agentspor
  personal_data: Tekniske spor av agentkjøringer, som kan inneholde spørsmål og svar
  data_subjects: Brukere og personer som omtales i samtaler
  purpose: Feilsøking i KI-funksjonene
  services: [privat, bedrift, lexolve-os, plattform]
  controller:
    privat: lavli
    bedrift: business
    lexolve-os: business
    plattform: business
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å rette feil i tjenesten)
  retention:
    privat: Om lag 14 dager
    bedrift: Om lag 14 dager
    lexolve-os: 30 dager
    plattform: Om lag 14 dager

- id: revisjonslogg
  personal_data: Logg over hvem som har fått tilgang til eller åpnet innhold, og når
  data_subjects: Brukere og Låvlis driftspersonell
  purpose: Kontroll med tilgang til innhold
  services: [privat, bedrift, lexolve-os, plattform]
  controller:
    privat: lavli
    bedrift: business
    lexolve-os: business
    plattform: business
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å kontrollere tilgang)
