    privat: GDPR art. 6 nr. 1 bokstav b (avtale med deg)
    bedrift: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å informere brukerne)
    lexolve-os: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å informere brukerne)
    plattform: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å informere brukerne)
  retention: Så lenge kontoen består

- id: markedsforing
  personal_data:
    privat: E-postadresse og samtykke
    lexolve-os: Navn og e-postadresse
  data_subjects:
    privat: Brukere som har samtykket
    lexolve-os: Brukere
