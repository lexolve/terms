    lexolve-os: Til du melder deg av

- id: advokatformidling
  personal_data: Det brukeren selv velger å sende, eventuelt et saksresymé
  data_subjects: Brukere og personer som omtales i saken
  purpose: Formidle forespørsel om tilbud fra advokatfirma
  services: [privat]
  controller: lavli
  legal_basis: GDPR art. 6 nr. 1 bokstav b (avtale med deg). For personer som omtales, art. 6 nr. 1 bokstav f (berettiget interesse i at brukeren får kontakt med advokat). Særlige kategorier etter art. 9 nr. 2 bokstav f (rettskrav)
  retention: Så lenge kontoen består

- id: forskning
  personal_data: Pseudonymiserte utdrag av spørsmål og svar
  data_subjects: Brukere og personer som omtales i samtaler
  purpose: Forskningsprosjektet med SINTEF AS
  services: [privat, bedrift]
  controller: lavli
  legal_basis: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å forske på kvalitetssikret juridisk KI), jf. art. 89 nr. 1. Særlige kategorier etter art. 9 nr. 2 bokstav j, jf. personopplysningsloven § 9
  retention: Til forskningsprosjektet er avsluttet
  deletion: Senest 1. mars 2028. Slettes ikke når samtalen slettes, fordi utdragene ikke kan knyttes til brukeren

