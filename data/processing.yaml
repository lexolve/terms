- id: sikkerhetskopier
  personal_data: Kopier av opplysningene over
  data_subjects: Som for opplysningene som kopieres
  purpose: Gjenoppretting etter feil eller hendelser
  services: [privat, bedrift, lexolve-os, plattform]
  controller:
    privat: lavli
    bedrift: business
    lexolve-os: business
    plattform: business
  legal_basis:
    privat: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å kunne gjenopprette tjenesten)
