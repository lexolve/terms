    privat: GDPR art. 6 nr. 1 bokstav a (samtykke), jf. markedsføringsloven § 15
    lexolve-os: GDPR art. 6 nr. 1 bokstav f (berettiget interesse i å markedsføre egne tjenester til kunder), jf. markedsføringsloven § 15
